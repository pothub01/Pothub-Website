<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account — PotHub</title>
  <meta name="description" content="Create your PotHub account to start shopping.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .auth-layout { min-height:100vh; display:grid; grid-template-columns:1fr 1fr; }
    .auth-visual { background:var(--color-black); color:var(--color-white); display:flex; flex-direction:column; justify-content:center; padding:60px; position:relative; overflow:hidden; }
    .auth-visual img { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:0.4; }
    .auth-visual-content { position:relative; z-index:2; }
    .auth-form-wrap { display:flex; align-items:center; justify-content:center; padding:60px 40px; background:var(--bg); }
    .auth-form { width:100%; max-width:420px; }
    @media(max-width:768px){ .auth-layout { grid-template-columns:1fr; } .auth-visual { display:none; } }
  </style>
</head>
<body>
  <div id="page-loader" class="page-loader"><div class="loader-spinner"></div></div>

  <div class="auth-layout">
    <div class="auth-visual">
      <img src="https://images.unsplash.com/photo-1501004318641-b39e6451bec6?auto=format&fit=crop&w=1200&q=80" alt="Plants">
      <div class="auth-visual-content">
        <a href="index.html" class="logo" style="font-size:2rem;margin-bottom:32px;display:inline-block;">PotHub</a>
        <h2 style="font-size:2rem;font-weight:700;margin-bottom:16px;">Join PotHub</h2>
        <p style="opacity:0.8;max-width:400px;line-height:1.7;">Create an account to save favorites, track orders, and get exclusive access to new collections.</p>
      </div>
    </div>
    <div class="auth-form-wrap">
      <div class="auth-form">
        <h1 style="font-size:1.75rem;font-weight:700;margin-bottom:8px;font-family:var(--font-display);">Create Account</h1>
        <p style="color:var(--color-text-muted);margin-bottom:32px;">Already have an account? <a href="login.html" style="color:var(--color-green);font-weight:600;">Sign in</a></p>

        <form id="register-form">
          <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" name="name" class="form-input" required placeholder="John Doe">
          </div>
          <div class="form-group">
            <label class="form-label">Email Address</label>
            <input type="email" name="email" class="form-input" required placeholder="you@example.com">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" class="form-input" required placeholder="Min 6 characters" minlength="6">
          </div>
          <div class="form-group">
            <label style="display:flex;align-items:center;gap:8px;font-size:0.875rem;color:var(--color-text-muted);cursor:pointer;">
              <input type="checkbox" required style="accent-color:var(--color-green);"> I agree to the <a href="#" style="color:var(--color-green);font-weight:600;">Terms</a> and <a href="#" style="color:var(--color-green);font-weight:600;">Privacy Policy</a>
            </label>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">Create Account</button>
        </form>

        <div style="margin-top:32px;text-align:center;">
          <p style="font-size:0.875rem;color:var(--color-text-muted);margin-bottom:16px;">Or sign up with</p>
          <div style="display:flex;gap:12px;justify-content:center;">
            <button class="btn btn-secondary" style="flex:1;">Google</button>
            <button class="btn btn-secondary" style="flex:1;">Apple</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
