<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout — PotHub</title>
  <meta name="description" content="Complete your purchase securely at PotHub.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .checkout-grid { display:grid; grid-template-columns:1fr 420px; gap:48px; align-items:start; }
    @media(max-width:1024px){ .checkout-grid { grid-template-columns:1fr; } }
    .checkout-section { background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius-lg); padding:32px; margin-bottom:24px; }
    .checkout-section h3 { font-size:1.125rem; font-weight:700; margin-bottom:20px; display:flex; align-items:center; gap:8px; }
    .checkout-section h3 span { width:28px; height:28px; border-radius:50%; background:var(--color-black); color:var(--color-white); display:flex; align-items:center; justify-content:center; font-size:0.875rem; }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
    @media(max-width:768px){ .form-row { grid-template-columns:1fr; } }
    .payment-method { border:1.5px solid var(--border); border-radius:var(--radius-md); padding:16px; display:flex; align-items:center; gap:12px; cursor:pointer; transition:var(--transition); }
    .payment-method:hover, .payment-method.active { border-color:var(--color-green); background:rgba(45,106,79,0.05); }
  </style>
</head>
<body>
  <div id="page-loader" class="page-loader"><div class="loader-spinner"></div></div>
  <div id="navbar-container"></div>

  <div class="container">
    <div class="breadcrumbs">
      <a href="index.html">Home</a> / <a href="cart.html">Cart</a> / <span>Checkout</span>
    </div>
  </div>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="section-header reveal">
        <div>
          <h1 class="section-title">Checkout</h1>
          <p class="section-subtitle">Complete your order securely</p>
        </div>
      </div>

      <form id="checkout-form" class="checkout-grid">
        <div>
          <div class="checkout-section reveal">
            <h3><span>1</span> Contact Information</h3>
            <div class="form-group">
              <label class="form-label">Email Address *</label>
              <input type="email" name="email" class="form-input" required placeholder="your@email.com">
            </div>
            <div class="form-group">
              <label class="form-label">Phone Number *</label>
              <input type="tel" name="phone" class="form-input" required placeholder="+1 (555) 000-0000">
            </div>
          </div>

          <div class="checkout-section reveal delay-100">
            <h3><span>2</span> Shipping Address</h3>
            <div class="form-group">
              <label class="form-label">Full Name *</label>
              <input type="text" name="shipping_name" class="form-input" required placeholder="John Doe">
            </div>
            <div class="form-group">
              <label class="form-label">Address *</label>
              <input type="text" name="address" class="form-input" required placeholder="123 Main Street">
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">City *</label>
                <input type="text" name="city" class="form-input" required>
              </div>
              <div class="form-group">
                <label class="form-label">Postal Code *</label>
                <input type="text" name="postal" class="form-input" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Country *</label>
                <select name="country" class="form-input" required>
                  <option value="">Select country</option>
                  <option value="US">United States</option>
                  <option value="CA">Canada</option>
                  <option value="UK">United Kingdom</option>
                  <option value="AU">Australia</option>
                  <option value="DE">Germany</option>
                  <option value="FR">France</option>
                </select>
              </div>
              <div class="form-group">
                <label class="form-label">State / Province</label>
                <input type="text" name="state" class="form-input">
              </div>
            </div>
          </div>

          <div class="checkout-section reveal delay-200">
            <h3><span>3</span> Shipping Method</h3>
            <div style="display:flex;flex-direction:column;gap:12px;">
              <label class="payment-method active" style="cursor:pointer;">
                <input type="radio" name="shipping" value="standard" checked style="accent-color:var(--color-green);">
                <div style="flex:1;">
                  <div style="font-weight:600;">Standard Shipping</div>
                  <div style="font-size:0.875rem;color:var(--color-text-muted);">5-7 business days</div>
                </div>
                <span style="font-weight:600;">$12.00</span>
              </label>
              <label class="payment-method" style="cursor:pointer;">
                <input type="radio" name="shipping" value="express" style="accent-color:var(--color-green);">
                <div style="flex:1;">
                  <div style="font-weight:600;">Express Shipping</div>
                  <div style="font-size:0.875rem;color:var(--color-text-muted);">2-3 business days</div>
                </div>
                <span style="font-weight:600;">$25.00</span>
              </label>
            </div>
          </div>

          <div class="checkout-section reveal delay-300">
            <h3><span>4</span> Payment</h3>
            <div style="display:flex;flex-direction:column;gap:12px;margin-bottom:20px;">
              <label class="payment-method active" style="cursor:pointer;">
                <input type="radio" name="payment" value="card" checked style="accent-color:var(--color-green);">
                <div style="font-weight:600;">Credit / Debit Card</div>
              </label>
              <label class="payment-method" style="cursor:pointer;">
                <input type="radio" name="payment" value="paypal" style="accent-color:var(--color-green);">
                <div style="font-weight:600;">PayPal</div>
              </label>
            </div>
            <div class="form-row">
              <div class="form-group" style="grid-column:1 / -1;">
                <label class="form-label">Card Number *</label>
                <input type="text" name="card_number" class="form-input" placeholder="0000 0000 0000 0000" required>
              </div>
            </div>
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">Expiry Date *</label>
                <input type="text" name="expiry" class="form-input" placeholder="MM/YY" required>
              </div>
              <div class="form-group">
                <label class="form-label">CVC *</label>
                <input type="text" name="cvc" class="form-input" placeholder="123" required>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Name on Card *</label>
              <input type="text" name="card_name" class="form-input" required>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="width:100%;">Place Order</button>
          <p style="font-size:0.875rem;color:var(--color-text-muted);text-align:center;margin-top:12px;">By placing this order you agree to our Terms of Service.</p>
        </div>

        <div id="checkout-summary" style="position:sticky;top:100px;">
          <!-- Populated by JS -->
        </div>
      </form>
    </div>
  </section>

  <div id="footer-container"></div>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/checkout.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
