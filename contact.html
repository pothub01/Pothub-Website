<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — PotHub</title>
  <meta name="description" content="Get in touch with the PotHub team for support, partnerships, or general inquiries.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>
  <div id="page-loader" class="page-loader"><div class="loader-spinner"></div></div>
  <div id="navbar-container"></div>

  <div class="container">
    <div class="breadcrumbs">
      <a href="index.html"></a> / <span></span>
    </div>
  </div>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="section-header reveal">
        <div>
          <h1 class="section-title">Get in Touch</h1>
          <p class="section-subtitle">We'd love to hear from you</p>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 1fr;gap:48px;align-items:start;" class="reveal">
        <div>
          <form id="contact-form" onsubmit="event.preventDefault();PotHub.App.toast('Message sent! We will reply within 24 hours.','success');this.reset();">
            <div class="form-row">
              <div class="form-group">
                <label class="form-label">First Name *</label>
                <input type="text" class="form-input" required>
              </div>
              <div class="form-group">
                <label class="form-label">Last Name *</label>
                <input type="text" class="form-input" required>
              </div>
            </div>
            <div class="form-group">
              <label class="form-label">Email Address *</label>
              <input type="email" class="form-input" required>
            </div>
            <div class="form-group">
              <label class="form-label">Subject</label>
              <select class="form-input">
                <option>General Inquiry</option>
                <option>Order Support</option>
                <option>Wholesale / Partnership</option>
                <option>Press</option>
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Message *</label>
              <textarea class="form-input" required placeholder="How can we help?"></textarea>
            </div>
            <button type="submit" class="btn btn-primary" style="width:100%;">Send Message</button>
          </form>
        </div>
        <div>
          <div style="background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:32px;margin-bottom:24px;">
            <h3 style="font-size:1.125rem;font-weight:700;margin-bottom:20px;">Contact Information</h3>
            <div style="display:flex;flex-direction:column;gap:16px;">
              <div style="display:flex;align-items:center;gap:12px;">
                <div style="width:40px;height:40px;border-radius:50%;background:var(--color-light-bg);display:flex;align-items:center;justify-content:center;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-green)" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>
                </div>
                <div>
                  <div style="font-weight:600;font-size:0.9375rem;">Email</div>
                  <div style="font-size:0.875rem;color:var(--color-text-muted);">hello@pothub.com</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:12px;">
                <div style="width:40px;height:40px;border-radius:50%;background:var(--color-light-bg);display:flex;align-items:center;justify-content:center;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-green)" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path></svg>
                </div>
                <div>
                  <div style="font-weight:600;font-size:0.9375rem;">Phone</div>
                  <div style="font-size:0.875rem;color:var(--color-text-muted);">+1 (555) 123-4567</div>
                </div>
              </div>
              <div style="display:flex;align-items:center;gap:12px;">
                <div style="width:40px;height:40px;border-radius:50%;background:var(--color-light-bg);display:flex;align-items:center;justify-content:center;">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--color-green)" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
                </div>
                <div>
                  <div style="font-weight:600;font-size:0.9375rem;">Address</div>
                  <div style="font-size:0.875rem;color:var(--color-text-muted);">123 Design District, Portland, OR 97201</div>
                </div>
              </div>
            </div>
          </div>
          <div style="background:var(--color-black);color:var(--color-white);border-radius:var(--radius-lg);padding:32px;">
            <h3 style="font-size:1.125rem;font-weight:700;margin-bottom:12px;">Need Quick Help?</h3>
            <p style="font-size:0.9375rem;opacity:0.8;margin-bottom:20px;line-height:1.6;">Visit our FAQ page for instant answers to common questions about shipping, returns, and product care.</p>
            <a href="faq.html" class="btn btn-white" style="font-size:0.875rem;">Visit FAQ</a>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div id="footer-container"></div>
  <button id="back-to-top" class="back-to-top" aria-label="Back to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"></polyline></svg>
  </button>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
