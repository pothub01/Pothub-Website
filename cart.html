<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shopping Cart — PotHub</title>
  <meta name="description" content="Review your cart and proceed to checkout at PotHub.">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="cart-page">
  <div id="page-loader" class="page-loader"><div class="loader-spinner"></div></div>
  <div id="navbar-container"></div>

  <div class="container">
    <div class="breadcrumbs">
      <a href="index.html"></a> / <span></span>
    </div>
  </div>

  <section class="section" style="padding-top:0;">
    <div class="container">
      <div class="section-header reveal">
        <div>
          <h1 class="section-title">Shopping Cart</h1>
          <p class="section-subtitle">Review your items and checkout when ready</p>
        </div>
      </div>

      <div style="display:grid;grid-template-columns:1fr 380px;gap:48px;align-items:start;">
        <div id="cart-items-container">
          <!-- Populated by JS -->
        </div>
        <div id="cart-summary">
          <!-- Populated by JS -->
        </div>
      </div>
    </div>
  </section>

  <div id="footer-container"></div>
  <button id="back-to-top" class="back-to-top" aria-label="Back to top">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"></polyline></svg>
  </button>

  <script src="js/products.js"></script>
  <script src="js/cart.js"></script>
  <script src="js/wishlist.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/animations.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      PotHub.Cart.renderPage();
    });
  </script>
</body>
</html>
